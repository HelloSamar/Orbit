name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Install ldid (lets pkg ad-hoc sign the macOS arm64 binary)
        run: sudo apt-get update && sudo apt-get install -y ldid || echo "ldid unavailable"
      - name: Build binaries (no V8 bytecode, so cross-platform builds run everywhere)
        run: npm run build:exe
      - name: Smoke-test the Linux binary in HTTPS mode
        run: |
          mkdir -p /tmp/orbit-test && cp dist/orbit-linux-x64 /tmp/orbit-test/orbit
          cd /tmp/orbit-test
          PORT=4555 ORBIT_HTTPS=1 ORBIT_PIN=0 ./orbit > out.log 2>&1 &
          for i in $(seq 1 30); do curl -sk https://localhost:4555/ -o /dev/null && break; sleep 1; done
          curl -skf https://localhost:4555/ -o /dev/null || { cat out.log; exit 1; }
          curl -skf https://localhost:4555/static/app.js -o /dev/null || { cat out.log; exit 1; }
          pkill orbit || true
      - name: Package
        run: |
          cd dist
          chmod +x orbit-macos-* orbit-linux-* 2>/dev/null || true
          for f in orbit-macos-* orbit-linux-*; do tar czf "$f.tar.gz" "$f" && rm "$f"; done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
  docker:
    runs-on: ubuntu-latest
    continue-on-error: true   # a Docker problem must never block the binaries
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # Uses the GHCR_TOKEN secret (personal access token) if set, else the built-in token
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
