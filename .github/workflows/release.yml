name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Install ldid (lets pkg ad-hoc sign the macOS arm64 binary)
        run: sudo apt-get update && sudo apt-get install -y ldid || echo "ldid unavailable"
      - run: npx pkg . --out-path dist
      - name: Package
        run: |
          cd dist
          chmod +x orbit-macos-* orbit-linux-* 2>/dev/null || true
          for f in orbit-macos-* orbit-linux-*; do tar czf "$f.tar.gz" "$f" && rm "$f"; done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
